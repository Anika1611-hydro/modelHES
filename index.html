<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модель разрушения Серебрянской ГЭС-1</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=4d843fd6-3ec5-4f2b-9e01-0bd3ad74c091&lang=ru_RU"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .balloon-content {
            width: 360px;
            padding: 5px;
        }
        .balloon-content h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #c0392b;
        }
        .balloon-content video {
            width: 100%;
            border-radius: 4px;
            background: #000;
            margin-bottom: 10px;
        }
        .balloon-content table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .balloon-content td {
            padding: 4px 6px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }
        .balloon-content td:first-child {
            color: #666;
            width: 45%;
        }
        .balloon-content td:last-child {
            color: #222;
            font-weight: bold;
        }
        .balloon-content .note {
            margin-top: 8px;
            font-size: 11px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        ymaps.ready(function () {
            // ==== КАРТА ====
            var myMap = new ymaps.Map("map", {
                center: [68.818056, 35.534167],   // Серебрянская ГЭС-1
                zoom: 11,
                controls: ['zoomControl', 'fullscreenControl', 'typeSelector']
            });

            // ==== ПОЛИГОН ЗОНЫ ЗАТОПЛЕНИЯ ====
            // Примерный контур ниже плотины по долине реки Воронья.
            // Замените координаты на реальный контур, если нарисуете в QGIS.
            var floodCoords = [
                [
                    [68.8180, 35.5340],  // у плотины
                    [68.8120, 35.5400],
                    [68.8050, 35.5480],
                    [68.7980, 35.5560],
                    [68.7900, 35.5650],  // низ долины
                    [68.7950, 35.5750],
                    [68.8030, 35.5680],
                    [68.8100, 35.5580],
                    [68.8160, 35.5480],
                    [68.8200, 35.5380]
                ]
            ];

            var floodPolygon = new ymaps.Polygon(floodCoords, {
                hintContent: "Зона затопления (базовый сценарий)"
            }, {
                fillColor: '#0066ff33',      // полупрозрачный синий
                strokeColor: '#0066ff',
                strokeWidth: 2,
                strokeStyle: 'dash'
            });

            myMap.geoObjects.add(floodPolygon);

            // ==== МЕТКА ГЭС С ИНФОРМАЦИЕЙ И ВИДЕО ====
            var damMarker = new ymaps.Placemark(
                [68.818056, 35.534167],
                {
                    balloonContent: `
                        <div class="balloon-content">
                            <h3>Серебрянская ГЭС-1</h3>
                            <video controls muted preload="metadata">
                                <source src="video.mp4" type="video/mp4">
                                Ваш браузер не поддерживает видео.
                            </video>
                            <table>
                                <tr><td>Река</td><td>Воронья</td></tr>
                                <tr><td>Расположение</td><td>Мурманская обл., Кольский р-н</td></tr>
                                <tr><td>Статус</td><td>Действующая</td></tr>
                                <tr><td>Установленная мощность</td><td>205 МВт</td></tr>
                                <tr><td>Тип</td><td>Плотинно-деривационная</td></tr>
                                <tr><td>Тип плотины</td><td>Каменно-накидная с моренным ядром</td></tr>
                                <tr><td>Высота плотины</td><td>78 м</td></tr>
                                <tr><td>Длина плотины</td><td>1820 м</td></tr>
                                <tr><td>Турбины</td><td>3 × поворотно-лопастные</td></tr>
                                <tr><td>Расход через турбины</td><td>3 × 101 м³/с</td></tr>
                                <tr><td>Расчётный напор</td><td>76 м</td></tr>
                                <tr><td>Пропускная способность водосброса</td><td>654 м³/с при НПУ</td></tr>
                                <tr><td>Площадь водохранилища</td><td>556 км²</td></tr>
                                <tr><td>Объём водохранилища</td><td>4174 млн м³</td></tr>
                                <tr><td>Полезный объём</td><td>1667 млн м³</td></tr>
                            </table>
                            <p class="note">Учебная симуляция. Данные из открытых источников.</p>
                        </div>
                    `,
                    hintContent: 'Серебрянская ГЭС-1 — нажмите для подробностей'
                },
                {
                    preset: 'islands#redIcon'
                }
            );

            myMap.geoObjects.add(damMarker);

            // ==== КНОПКА «КЛИМАТИЧЕСКИЙ СЦЕНАРИЙ» ====
            var climateButton = new ymaps.control.Button({
                data: {
                    content: "Задействовать климатический сценарий",
                    title: "Переключить на сценарий экстремального паводка"
                },
                options: {
                    selectOnClick: true,
                    maxWidth: 260
                }
            });

            climateButton.events.add('select', function () {
                // Меняем цвет полигона на «опасный» красный
                floodPolygon.options.set({
                    fillColor: '#ff000066',
                    strokeColor: '#cc0000',
                    strokeWidth: 3,
                    strokeStyle: 'solid'
                });
                floodPolygon.properties.set(
                    'hintContent',
                    'Зона затопления (сценарий: экстремальный паводок + климат 2050)'
                );
                // Меняем текст кнопки
                climateButton.data.set('content', 'Климатический сценарий ВКЛ');
            });

            climateButton.events.add('deselect', function () {
                // Возвращаем базовый вид
                floodPolygon.options.set({
                    fillColor: '#0066ff33',
                    strokeColor: '#0066ff',
                    strokeWidth: 2,
                    strokeStyle: 'dash'
                });
                floodPolygon.properties.set(
                    'hintContent',
                    'Зона затопления (базовый сценарий)'
                );
                climateButton.data.set('content', 'Задействовать климатический сценарий');
            });

            myMap.controls.add(climateButton, { float: 'right' });
        });
    </script>
</body>
</html>
