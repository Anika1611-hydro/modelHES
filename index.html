<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Гидрохимия на карте</title>
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- Библиотеки для чтения GeoTIFF (растров) прямо в браузере -->
    <script src="https://unpkg.com/georaster"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>

    <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; font-family: Arial, sans-serif; }
        .panel { position: absolute; top: 16px; right: 20px; z-index: 1000; background: white; padding: 14px 18px; border-radius: 8px; box-shadow: 0 3px 12px rgba(0,0,0,0.25); font-size: 15px; width: 340px; max-height: 90vh; overflow-y: auto; }
        .panel h3 { margin: 0 0 10px 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .group { border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
        .group-header { background: #f5f5f5; padding: 8px 12px; cursor: pointer; font-weight: bold; font-size: 14px; user-select: none; display: flex; justify-content: space-between; align-items: center; }
        .group-header:hover { background: #ececec; }
        .group-header .arrow { font-size: 11px; color: #666; transition: transform 0.15s; }
        .group.open .group-header .arrow { transform: rotate(90deg); }
        .group-body { display: none; padding: 8px 12px; }
        .group.open .group-body { display: block; }
        .param-row { display: block; margin-bottom: 5px; cursor: pointer; user-select: none; }
        .param-row.disabled { opacity: 0.35; cursor: not-allowed; }
        .param-row input { margin-right: 6px; }
        .btn { display: block; width: 100%; margin-top: 10px; padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; cursor: pointer; text-align: center; }
        .btn:hover { background: #eee; }
        .btn-primary { background: #1976d2; color: white; border-color: #1976d2; font-weight: bold; }
        .sat-select { width: 100%; padding: 6px; margin-bottom: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        .sat-label { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; }
        .balloon-table { border-collapse: collapse; font-size: 13px; width: 100%; margin-bottom: 10px; }
        .balloon-table td { border: 1px solid #ddd; padding: 4px 8px; }
        .balloon-table td:first-child { background: #f5f5f5; font-weight: bold; white-space: nowrap; }
        .chart-wrapper { width: 500px; height: 250px; margin-top: 10px; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background-color: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 1000px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; font-weight: bold; cursor: pointer; color: #333; }
        .close-modal:hover { color: red; }
        .modal-charts { display: flex; gap: 20px; margin-top: 20px; }
        .modal-chart-box { flex: 1; height: 350px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="panel">
        <h3>Параметры (Химия)</h3>
        <div id="groupsContainer"></div>
        <button class="btn btn-primary" id="btnClimate" style="margin-top: 15px;">Графики климата</button>
        <h3 style="margin-top: 15px; border-bottom: none;">Спутниковые слои</h3>
        <label class="sat-label" style="color: #2e7d32;">NDVI водосбора</label>
        <select id="ndviSelect" class="sat-select"><option value="none">-- Скрыть --</option></select>
        <label class="sat-label" style="color: #0277bd;">Осадки водосбора</label>
        <select id="precipSelect" class="sat-select"><option value="none">-- Скрыть --</option></select>
        <label style="display: block; margin-top: 10px; font-size: 14px; cursor: pointer;">
            <input type="checkbox" id="chkBasinBorder"> Показать контур водосбора
        </label>
        <button class="btn" id="btnClear">Сбросить химию</button>
    </div>

    <div id="climateModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Климатические данные</h2>
            <div class="modal-charts">
                <div class="modal-chart-box"><canvas id="bigNdviChart"></canvas></div>
                <div class="modal-chart-box"><canvas id="bigPrecipChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        var map = L.map('map', { attributionControl: false }).setView([59.0, 30.5], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // --- 1. КОНТУР И МАСКА ДЛЯ РАСТРА ---
        var watershedBorder = null;
        var watershedMask = null; // Сюда сохраним GeoJSON для маски

        fetch('luga_watershed.geojson').then(res => res.json()).then(data => {
            // Сохраняем для маски
            watershedMask = data; 

            // Рисуем контур
            watershedBorder = L.geoJSON(data, { style: { color: '#2e7d32', weight: 3, dashArray: '5, 5', fillOpacity: 0 } });
            if (document.getElementById('chkBasinBorder').checked) map.addLayer(watershedBorder);
            
            console.log("Контур и маска загружены.");
        }).catch(err => console.error('Ошибка контура:', err));

        document.getElementById('chkBasinBorder').addEventListener('change', function(e) {
            if (watershedBorder) { 
                if (e.target.checked) map.addLayer(watershedBorder); 
                else map.removeLayer(watershedBorder); 
            }
        });

        // --- 2. ЧТЕНИЕ РАСТРОВ (GeoTIFF) ---
        var ndviLayer = null, precipLayer = null;

        function updateSatLayer(type, value) {
            // Удаляем старые слои
            if (type === 'ndvi' && ndviLayer) { map.removeLayer(ndviLayer); ndviLayer = null; }
            if (type === 'precip' && precipLayer) { map.removeLayer(precipLayer); precipLayer = null; }
            if (value === 'none') return;

            // Формируем путь. У нас теперь TIF, без -converted
            var fileName = 'luga_' + type + '_' + value + '.tif';
            var folder = (type === 'ndvi') ? 'NDVI_Years/' : 'Precip_Years/';
            
            // Показываем индикатор загрузки (опционально)
            console.log("Загрузка файла:", folder + fileName);

            fetch(folder + fileName)
                .then(response => {
                    if (!response.ok) throw new Error("Файл не найден: " + response.status);
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => parseGeoraster(arrayBuffer))
                .then(georaster => {
                    // Создаем слой
                    var layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: 0.8,
                        resolution: 256,
                        // МАГИЯ: Обрезаем растр по нашему водосбору
                        mask: watershedMask,
                        mask_strategy: 'inside' // Показываем только то, что ВНУТРИ
                    });
                    
                    map.addLayer(layer);
                    if (type === 'ndvi') ndviLayer = layer;
                    if (type === 'precip') precipLayer = layer;
                    
                    // Опционально: подлетаем к границам растра
                    // map.fitBounds(layer.getBounds()); 
                })
                .catch(err => {
                    console.error("Ошибка загрузки TIF:", err);
                    alert("Не удалось загрузить слой. Проверьте консоль (F12).");
                });
        }

        document.getElementById('ndviSelect').addEventListener('change', e => updateSatLayer('ndvi', e.target.value));
        document.getElementById('precipSelect').addEventListener('change', e => updateSatLayer('precip', e.target.value));

        // --- 3. СПИСКИ ---
        function populateSelects() {
            var selectNdvi = document.getElementById('ndviSelect');
            var selectPrecip = document.getElementById('precipSelect');
            var seasons = ['winter', 'spring', 'summer', 'autumn'];
            var seasonNames = { winter: 'Зима', spring: 'Весна', summer: 'Лето', autumn: 'Осень' };
            var html = '<option value="none">-- Скрыть --</option>';
            for (var y = 2023; y >= 2008; y--) {
                html += '<optgroup label="' + y + ' год">';
                seasons.forEach(function(s) { html += '<option value="' + s + '_' + y + '">' + seasonNames[s] + '</option>'; });
                html += '</optgroup>';
            }
            selectNdvi.innerHTML = html;
            selectPrecip.innerHTML = html;
        }
        populateSelects();

        // --- 4. ХИМИЯ ---
        var GROUPS = {
            'Азотистые': ['NH₄⁺', 'азот нитритный', 'NO₃', 'NO₂'],
            'Металлы': ['Cu', 'Feобщ', 'Feраств', 'Mn', 'Zn', 'Mg', 'Ca', 'Cr', 'Hg', 'Pb', 'Cd', 'Fe'],
            'Физико-химические': ['pH', 'рН', 'Жₒ', 'PO₄³⁻', 'ХПК', 'БПК5', 'ПМО']
        };
        var COLOR_WITH_FLOW = '#1976d2', COLOR_ONLY_OWN = '#f57c00';
        var stations = {}, markers = {}, allParams = {}, activeParams = {};
        var availableParams = null;
        var FILES = [
            { url: 'stations_unified.geojson',   role: 'chemistry', dateField: 'date' },
            { url: 'stations_discharge.geojson', role: 'discharge', dateField: 'date' }
        ];
        var PALETTE = ['#1976d2', '#e65100', '#6a1b9a', '#00838f', '#c62828', '#2e7d32', '#f9a825', '#4e342e', '#37474f', '#ad1457'];
        
        var chartCounter = 0, activeCharts = {}, openPopupStationId = null;

        function loadFile(cfg) {
            return fetch(cfg.url).then(r => r.json()).then(data => {
                data.features.forEach(feat => {
                    var p = feat.properties;
                    var sid = p.station_id || 'unknown';
                    
                    // Координаты в правильном порядке [lon, lat]
                    var lon = feat.geometry.coordinates[0];
                    var lat = feat.geometry.coordinates[1];
                    var coords = [lat, lon]; 

                    if (!stations[sid]) stations[sid] = { station_id: sid, name: p.name || sid, river: p.river || '', coords: coords, measurements: [], hasDischarge: false };
                    
                    if (cfg.role === 'chemistry') {
                        if (p.parameter && p.value != null && p.value !== '') {
                            stations[sid].measurements.push({ source: p.source || '', param: p.parameter, value: p.value, unit: p.unit || '', date: p.date || '' });
                            if (!allParams[p.parameter]) allParams[p.parameter] = {};
                            allParams[p.parameter][sid] = true;
                        }
                    } else if (cfg.role === 'discharge') {
                        if (p.value != null && p.value !== '') {
                            stations[sid].measurements.push({ source: 'discharge', param: 'расход воды', value: p.value, unit: p.unit || 'м3/с', date: p.date || '' });
                            stations[sid].hasDischarge = true;
                        }
                    }
                });
            }).catch(err => console.error('Ошибка загрузки ' + cfg.url, err));
        }

        function buildPanel() {
            var container = document.getElementById('groupsContainer');
            container.innerHTML = '';
            Object.keys(GROUPS).forEach(groupName => {
                var groupDiv = document.createElement('div'); groupDiv.className = 'group open';
                var header = document.createElement('div'); header.className = 'group-header';
                header.innerHTML = '<span>' + groupName + '</span><span class="arrow">▶</span>';
                header.addEventListener('click', () => groupDiv.classList.toggle('open'));
                groupDiv.appendChild(header);
                var body = document.createElement('div'); body.className = 'group-body';
                GROUPS[groupName].forEach(param => {
                    if (!allParams[param]) return;
                    var label = document.createElement('label'); label.className = 'param-row'; label.setAttribute('data-param', param);
                    label.innerHTML = '<input type="checkbox" data-param="' + param + '"> ' + param;
                    body.appendChild(label);
                });
                groupDiv.appendChild(body); container.appendChild(groupDiv);
            });
            container.querySelectorAll('input[type=checkbox]').forEach(cb => {
                cb.addEventListener('change', () => {
                    var param = cb.getAttribute('data-param');
                    if (cb.checked) activeParams[param] = true; else delete activeParams[param];
                    recomputeAvailable(); applyFilter(); refreshBalloons();
                });
            });
        }

        function recomputeAvailable() {
            var selected = Object.keys(activeParams);
            if (selected.length === 0) availableParams = null;
            else {
                var relSt = {};
                selected.forEach(p => { if (allParams[p]) Object.keys(allParams[p]).forEach(sid => relSt[sid] = true); });
                availableParams = {};
                Object.keys(allParams).forEach(p => {
                    Object.keys(allParams[p]).forEach(sid => { if (relSt[sid]) availableParams[p] = true; });
                });
            }
            document.querySelectorAll('#groupsContainer .param-row').forEach(row => {
                var p = row.getAttribute('data-param'), cb = row.querySelector('input');
                var isActive = !!activeParams[p], isAvailable = (availableParams === null) || availableParams[p];
                if (!isAvailable && !isActive) { row.classList.add('disabled'); cb.disabled = true; }
                else { row.classList.remove('disabled'); cb.disabled = false; }
                if (isActive) row.classList.add('active'); else row.classList.remove('active');
            });
        }

        function applyFilter() {
            Object.keys(markers).forEach(sid => {
                var marker = markers[sid], st = stations[sid];
                var baseColor = st.hasDischarge ? COLOR_WITH_FLOW : COLOR_ONLY_OWN;
                marker.setStyle({ fillColor: baseColor, opacity: 1, fillOpacity: 0.9 });
            });
        }

        function refreshBalloons() {
            Object.keys(markers).forEach(sid => {
                markers[sid].setPopupContent(buildBalloon(stations[sid]));
            });
            if (openPopupStationId && markers[openPopupStationId] && markers[openPopupStationId].isPopupOpen()) {
                setTimeout(() => {
                    var canvases = document.querySelectorAll('.leaflet-popup-content canvas');
                    if (canvases.length) {
                        renderChart(canvases[canvases.length - 1].id);
                    }
                }, 100);
            }
        }

        function buildBalloon(st) {
            var html = '<div><h3>' + (st.river || '') + ' — ' + (st.name || st.station_id) + '</h3>';
            var selected = Object.keys(activeParams), flowPoints = st.measurements.filter(m => m.param === 'расход воды'), hasFlow = flowPoints.length > 0;
            var filtered = st.measurements.filter(m => activeParams[m.param] && m.param !== 'расход воды');
            if (selected.length === 0 && !hasFlow) return html + '<div style="color:#999">Выберите параметр</div></div>';

            var byParam = {};
            filtered.forEach(m => {
                if (!byParam[m.param]) byParam[m.param] = { count: 0, min: Infinity, max: -Infinity, unit: m.unit };
                byParam[m.param].count++;
                var v = parseFloat(m.value);
                if (!isNaN(v)) { if (v < byParam[m.param].min) byParam[m.param].min = v; if (v > byParam[m.param].max) byParam[m.param].max = v; }
            });

            if (Object.keys(byParam).length > 0) {
                html += '<table class="balloon-table"><tr><td>Параметр</td><td>N</td><td>Мин</td><td>Макс</td><td>Ед.</td></tr>';
                Object.keys(byParam).sort().forEach(p => { var b = byParam[p]; html += '<tr><td>' + p + '</td><td>' + b.count + '</td><td>' + (isFinite(b.min) ? b.min.toFixed(2) : '—') + '</td><td>' + (isFinite(b.max) ? b.max.toFixed(2) : '—') + '</td><td>' + b.unit + '</td></tr>'; });
                html += '</table>';
            }

            if (hasFlow) {
                var fv = flowPoints.map(m => parseFloat(m.value)).filter(v => !isNaN(v));
                if (fv.length > 0) {
                    html += '<table class="balloon-table"><tr><td>Параметр</td><td>N</td><td>Мин</td><td>Средн.</td><td>Макс</td><td>Ед.</td></tr>';
                    html += '<tr><td>расход воды</td><td>' + fv.length + '</td><td>' + Math.min(...fv).toFixed(2) + '</td><td>' + (fv.reduce((a,b)=>a+b,0)/fv.length).toFixed(2) + '</td><td>' + Math.max(...fv).toFixed(2) + '</td><td>м³/с</td></tr></table>';
                }
            }

            var canvasId = 'chart_' + (++chartCounter);
            html += '<div class="chart-wrapper"><canvas id="' + canvasId + '"></canvas></div></div>';
            window.__pendingCharts = window.__pendingCharts || {};
            window.__pendingCharts[canvasId] = { st, filtered, selected, flowPoints };
            return html;
        }

        function renderChart(canvasId) {
            var payload = window.__pendingCharts[canvasId]; if (!payload) return;
            var canvas = document.getElementById(canvasId); if (!canvas) return;
            
            if (activeCharts[canvasId]) {
                activeCharts[canvasId].destroy();
                delete activeCharts[canvasId];
            }

            var { st, filtered, selected, flowPoints } = payload;
            var allDates = {};
            filtered.forEach(m => { if (m.date) allDates[m.date] = true; });
            flowPoints.forEach(m => { if (m.date) allDates[m.date] = true; });
            var labels = Object.keys(allDates).sort();

            var datasets = [], colorIdx = 0;
            selected.forEach(param => {
                var points = filtered.filter(m => m.param === param);
                if (!points.length) return;
                datasets.push({ label: param, data: labels.map(d => { var f = points.find(m => m.date === d); return f ? parseFloat(f.value) : null; }), borderColor: PALETTE[colorIdx % PALETTE.length], tension: 0.2, pointRadius: 4, spanGaps: true, yAxisID: 'y' });
                colorIdx++;
            });

            if (flowPoints.length > 0) {
                datasets.push({ label: 'расход воды', data: labels.map(d => { var f = flowPoints.find(m => m.date === d); return f ? parseFloat(f.value) : null; }), borderColor: '#43a047', borderDash: [4, 3], tension: 0.2, pointRadius: 3, spanGaps: true, yAxisID: 'y1' });
            }

            var showFlow = datasets.some(d => d.yAxisID === 'y1');
            activeCharts[canvasId] = new Chart(canvas.getContext('2d'), {
                type: 'line', data: { labels, datasets },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true } }, scales: { x: { ticks: { font: { size: 10 } } }, y: { position: 'left' }, y1: { position: 'right', display: showFlow, grid: { drawOnChartArea: false } } } }
            });
        }

        function buildPoints() {
            Object.keys(stations).forEach(sid => {
                var st = stations[sid];
                var color = st.hasDischarge ? COLOR_WITH_FLOW : COLOR_ONLY_OWN;
                
                var marker = L.circleMarker(st.coords, {
                    radius: 8, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.9
                }).addTo(map);

                marker.bindPopup(buildBalloon(st), { maxWidth: 550 });
                
                marker.on('popupopen', function() {
                    openPopupStationId = sid;
                    setTimeout(() => { 
                        var canvases = document.querySelectorAll('.leaflet-popup-content canvas'); 
                        if (canvases.length) renderChart(canvases[canvases.length - 1].id); 
                    }, 100); 
                });
                marker.on('popupclose', function() { 
                    if (openPopupStationId === sid) openPopupStationId = null; 
                });

                markers[sid] = marker;
            });
        }

        Promise.all(FILES.map(loadFile)).then(() => { 
            buildPanel(); buildPoints(); recomputeAvailable(); 
        }).catch(err => console.error(err));

        document.getElementById('btnClear').addEventListener('click', () => {
            activeParams = {}; availableParams = null;
            document.querySelectorAll('#groupsContainer input[type=checkbox]').forEach(cb => { cb.checked = false; cb.disabled = false; cb.closest('.param-row').classList.remove('active', 'disabled'); });
            applyFilter(); refreshBalloons();
        });

        // --- 5. КЛИМАТ ---
        var climateData = [];
        var bigNdviChart = null, bigPrecipChart = null;
        
        fetch('luga_climate.json').then(res => res.json()).then(data => { climateData = data; });

        document.getElementById('btnClimate').addEventListener('click', function() {
            document.getElementById('climateModal').style.display = 'flex';
            
            if (!bigNdviChart && climateData.length > 0) {
                var labels = climateData.map(d => d.date);
                
                bigNdviChart = new Chart(document.getElementById('bigNdviChart'), {
                    type: 'line', 
                    data: { 
                        labels: labels, 
                        datasets: [{ 
                            label: 'NDVI', 
                            data: climateData.map(d => d.ndvi), 
                            borderColor: '#4caf50', 
                            fill: true, 
                            pointRadius: 0 
                        }] 
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
                
                bigPrecipChart = new Chart(document.getElementById('bigPrecipChart'), {
                    type: 'bar', 
                    data: { 
                        labels: labels, 
                        datasets: [{ 
                            label: 'Осадки, мм', 
                            data: climateData.map(d => d.precip_mm), 
                            backgroundColor: '#29b6f6' 
                        }] 
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        });
        
        document.getElementById('closeModal').addEventListener('click', function() { 
            document.getElementById('climateModal').style.display = 'none'; 
        });
    </script>
</body>
</html>
