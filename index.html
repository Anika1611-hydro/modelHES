<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Тест карты</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=4d843fd6-3ec5-4f2b-9e01-0bd3ad74c091"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        .panel { position: absolute; top: 10px; right: 10px; background: white; padding: 10px; z-index: 1000; }
        button { padding: 10px; margin-bottom: 5px; display: block; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="panel">
        <button id="btnShowImage">Показать картинку</button>
        <button id="btnShowBorder">Показать контур</button>
    </div>

    <script>
        ymaps.ready(function () {
            var myMap = new ymaps.Map('map', {
                center: [59.0, 30.5],
                zoom: 8
            });

            // 1. ТЕСТОВАЯ КАРТИНКА (просто прямоугольник по координатам водосбора)
            var basinBounds = [[58.5086, 28.1064], [59.6783, 30.2413]];
            var imageLayer = new ymaps.GeoObject({
                geometry: { type: "Rectangle", coordinates: basinBounds }
            }, {
                fillImage: { href: 'test_ndvi.png', opacity: 0.9 },
                stroke: false
            });

            // 2. ТЕСТОВЫЙ КОНТУР (просто треугольник, чтобы проверить, что он рисуется)
            // Координаты [широта, долгота]
            var borderCoords = [
                [59.5, 28.0], 
                [59.2, 28.5], 
                [59.6, 29.0], 
                [59.5, 28.0]
            ];
            var borderLayer = new ymaps.GeoObject({
                geometry: { type: "Polygon", coordinates: [borderCoords] }
            }, {
                fillColor: 'FF000033', 
                strokeColor: 'FF0000', 
                strokeWidth: 3
            });

            // Кнопки
            document.getElementById('btnShowImage').onclick = function() {
                if (myMap.geoObjects.indexOf(imageLayer) === -1) {
                    myMap.geoObjects.add(imageLayer);
                }
            };

            document.getElementById('btnShowBorder').onclick = function() {
                if (myMap.geoObjects.indexOf(borderLayer) === -1) {
                    myMap.geoObjects.add(borderLayer);
                }
            };
        });
    </script>
</body>
</html>
