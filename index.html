<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Тест финал</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=4d843fd6-3ec5-4f2b-9e01-0bd3ad74c091"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        .panel { position: absolute; top: 10px; right: 10px; background: white; padding: 10px; z-index: 1000; }
        button { padding: 10px; margin-bottom: 5px; display: block; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="panel">
        <button id="btnBorder">Показать контур</button>
        <button id="btnImage">Показать картинку</button>
    </div>

    <script>
        ymaps.ready(function () {
            var myMap = new ymaps.Map('map', {
                center: [59.0, 30.5],
                zoom: 8
            });

            // 1. РИСУЕМ НАСТОЯЩИЙ КОНТУР
            var watershedBorder = null;
            fetch('luga_watershed.geojson')
                .then(res => res.text())
                .then(text => {
                    var data = JSON.parse(text.replace(/^\uFEFF/, ''));
                    var coords = data.features[0].geometry.coordinates;
                    if (data.features[0].geometry.type === 'MultiPolygon') coords = coords[0];

                    // Координаты в файле уже [lat, lon] (я их перевернул)
                    watershedBorder = new ymaps.GeoObject({
                        geometry: { type: "Polygon", coordinates: [coords] }
                    }, { fillColor: '00000000', strokeColor: '#2e7d32', strokeWidth: 3, strokeStyle: 'dash' });
                });

            document.getElementById('btnBorder').onclick = function() {
                if (watershedBorder) myMap.geoObjects.add(watershedBorder);
                else alert("Контур еще грузится");
            };

            // 2. НАКЛАДЫВАЕМ КАРТИНКУ КАК СЛОЙ (Layer)
            // Координаты углов прямоугольника, в который вписан твой водосбор
            var bounds = [[58.425, 27.670], [59.709, 31.137]]; 
            var imageLayer = null;

            document.getElementById('btnImage').onclick = function() {
                if (imageLayer) myMap.layers.remove(imageLayer);
                
                // Используем Layer с прозрачностью
                imageLayer = new ymaps.Layer('test_ndvi.png', {
                    transparent: true, 
                    projection: ymaps.projection.wgs84Mercator
                });

                // Привязываем к границам
                imageLayer.options.set('bounds', bounds);
                imageLayer.options.set('opacity', 0.9);

                myMap.layers.add(imageLayer);
            };
        });
    </script>
</body>
</html>
