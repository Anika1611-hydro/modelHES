<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Гидрохимия на карте</title>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .balloon-table {
            border-collapse: collapse;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: block;
        }
        .balloon-table td {
            border: 1px solid #ddd;
            padding: 3px 6px;
        }
        .balloon-table td:first-child {
            background: #f5f5f5;
            font-weight: bold;
            white-space: nowrap;
        }
        .layer-switcher {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-size: 13px;
        }
        .layer-switcher label {
            display: block;
            margin-bottom: 5px;
            cursor: pointer;
        }
    </style>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=4d843fd6-3ec5-4f2b-9e01-0bd3ad74c091" type="text/javascript"></script>
</head>
<body>
    <div id="map"></div>

    <div class="layer-switcher">
        <label><input type="checkbox" id="chk_own" checked> Собственные 2024–2026</label>
        <label><input type="checkbox" id="chk_flow"> Расход + ПДК 2019–2024</label>
        <label><input type="checkbox" id="chk_avg"> Среднегодовые 2010–2024</label>
    </div>

    <script>
        ymaps.ready(function () {
            var myMap = new ymaps.Map('map', {
                center: [59.0, 30.5],   // [широта, долгота]
                zoom: 8,
                controls: ['zoomControl', 'fullscreenControl', 'typeSelector']
            });

            // Создаём три пустые коллекции объектов — по одной на слой
            var layers = {
                own:  new ymaps.GeoObjectCollection(),
                flow: new ymaps.GeoObjectCollection(),
                avg:  new ymaps.GeoObjectCollection()
            };

            // Функция для содержимого балуна
            function makeBalloonContent(properties) {
                var html = '<div class="balloon-table">';
                html += '<table>';
                for (var key in properties) {
                    var val = properties[key];
                    if (val === null || val === undefined || val === '') continue;
                    html += '<tr><td>' + key + '</td><td>' + val + '</td></tr>';
                }
                html += '</table></div>';
                return html;
            }

            // Загрузка одного слоя
            function loadLayer(url, targetCollection) {
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        data.features.forEach(function (feat) {
                            var coords = feat.geometry.coordinates; // [lat, lon] после переворота
                            var placemark = new ymaps.Placemark(
                                coords,
                                {
                                    hintContent: feat.properties.station_id || 'Точка',
                                    balloonContent: makeBalloonContent(feat.properties)
                                },
                                {
                                    preset: 'islands#blueCircleDotIcon',
                                    balloonMaxWidth: 400,
                                    balloonPanelMaxMapArea: 0
                                }
                            );
                            targetCollection.add(placemark);
                        });
                    })
                    .catch(function (err) {
                        console.error('Ошибка загрузки ' + url + ':', err);
                    });
            }

            // Грузим три файла
            loadLayer('stations_own.geojson',  layers.own);
            loadLayer('stations_flow.geojson', layers.flow);
            loadLayer('stations_avg.geojson',  layers.avg);

            // Добавляем все коллекции на карту
            Object.keys(layers).forEach(function (k) {
                myMap.geoObjects.add(layers[k]);
            });

            // Переключатели видимости
            document.getElementById('chk_own').addEventListener('change', function (e) {
                layers.own.options.set('visible', e.target.checked);
            });
            document.getElementById('chk_flow').addEventListener('change', function (e) {
                layers.flow.options.set('visible', e.target.checked);
            });
            document.getElementById('chk_avg').addEventListener('change', function (e) {
                layers.avg.options.set('visible', e.target.checked);
            });

            // По умолчанию показываем только "own"
            layers.flow.options.set('visible', false);
            layers.avg.options.set('visible', false);
        });
    </script>
</body>
</html>
