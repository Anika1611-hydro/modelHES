<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Тест</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=4d843fd6-3ec5-4f2b-9e01-0bd3ad74c091"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        .panel { position: absolute; top: 10px; right: 10px; background: white; padding: 10px; z-index: 1000; }
        button { padding: 10px; margin-bottom: 5px; display: block; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="panel">
        <button id="btnShowBorder">Показать контур</button>
        <button id="btnShowImage">Показать тестовую картинку</button>
    </div>

    <script>
        ymaps.ready(function () {
            // 1. Проверяем, что ключ API работает (если карта серая - ключ или лимит)
            var myMap = new ymaps.Map('map', {
                center: [59.0, 30.5],
                zoom: 8
            });

            // 2. Тестовый контур (первые 5 точек из твоего GeoJSON, координаты уже [lat, lon])
            var borderCoords = [
                [59.6592, 28.0914], 
                [59.6575, 28.1031], 
                [59.6520, 28.1047], 
                [59.6438, 28.1118], 
                [59.6592, 28.0914]
            ];
            var borderLayer = new ymaps.GeoObject({
                geometry: { type: "Polygon", coordinates: [borderCoords] }
            }, { fillColor: 'FF000033', strokeColor: 'FF0000', strokeWidth: 3 });

            // 3. Тестовая картинка (прямая ссылка на твой test_ndvi.png)
            // Если картинка не грузится, проверь, что файл лежит в корне и называется именно так
            var imageLayer = new ymaps.GeoObject({
                geometry: { type: "Rectangle", coordinates: [[59.21, 27.67], [59.74, 28.56]] }
            }, {
                fillImage: { href: 'test_ndvi.png', opacity: 0.8 },
                stroke: false
            });

            // Кнопки
            document.getElementById('btnShowBorder').onclick = function() { myMap.geoObjects.add(borderLayer); };
            document.getElementById('btnShowImage').onclick = function() { myMap.geoObjects.add(imageLayer); };
        });
    </script>
</body>
</html>
